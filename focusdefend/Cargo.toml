[package]
name = "focusdefend"
version = "1.0.0"
edition = "2021"
authors = ["Aviral Dewangan <aviral@bharatos.in>"]
description = "Sovereign Deep-Work Shield, Distraction Blocker, and Focus Analytics Suite"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"

[lib]
name = "focusdefend"
path = "src/lib.rs"

[[bin]]
name = "focusdefend-cli"
path = "src/main.rs"
